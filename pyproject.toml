[project]
name = "financial-toolkit"
version = "0.1.0"
description = "Toolkit for multi-source market and macro data extraction, analysis and portfolio management"
requires-python = ">=3.12"
dependencies = [
    "fredapi>=0.5.2",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]