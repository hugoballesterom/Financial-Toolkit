[project]
name = "financial-toolkit"
version = "0.1.0"
description = "Toolkit for multi-source market and macro data extraction, analysis and portfolio management"
requires-python = ">=3.12"
dependencies = [
    "fredapi>=0.5.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
]
